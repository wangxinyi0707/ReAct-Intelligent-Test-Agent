<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 测试中心 - TripGenius</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body class="bg-gray-100">

<!-- 登录遮罩 -->
<div id="loginMask" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-8 w-96 shadow-xl">
        <h2 class="text-xl font-bold mb-4 text-gray-800">登录测试中心</h2>
        <input id="loginUsername" class="border p-2 w-full mb-3 rounded" placeholder="用户名">
        <input id="loginPassword" type="password" class="border p-2 w-full mb-3 rounded" placeholder="密码">
        <p id="loginError" class="text-red-500 text-sm mb-2 hidden"></p>
        <button onclick="doLogin()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">登录</button>
        <p class="text-gray-400 text-xs mt-3 text-center">演示账号：demo_admin / admin12345</p>
    </div>
</div>

<div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">AI 测试中心</h1>
            <p class="text-gray-500 mt-1">AI 生成用例 · 接口扫描 · 自动执行 · 失败分析 · Agent 自主测试</p>
        </div>
        <button onclick="logout()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded">退出</button>
    </div>

    <!-- 统计看板 -->
    <div id="statsCards" class="grid grid-cols-4 gap-4 mb-6"></div>
    <div id="trendChart" class="bg-white rounded-lg p-4 mb-6 shadow" style="height:220px;"></div>

    <!-- AI Agent 执行 -->
    <div class="bg-white rounded-lg p-5 shadow mb-6">
        <h3 class="font-bold text-lg mb-1">AI 测试 Agent（自主执行）</h3>
        <p class="text-gray-400 text-sm mb-3">输入自然语言测试目标，Agent 自主扫描接口、规划步骤、调用接口并判断结果，失败时自动分析重试。</p>
        <div class="flex gap-2">
            <input id="agentGoal" class="border p-2 rounded flex-1"
                   placeholder="例如：验证 注册→登录→创建旅行计划 的完整流程">
            <button onclick="runAgent()" class="bg-fuchsia-600 text-white px-5 py-2 rounded">Agent 执行</button>
        </div>
    </div>

    <!-- 功能区 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <!-- AI 生成用例 -->
        <div class="bg-white rounded-lg p-5 shadow lg:col-span-1">
            <h3 class="font-bold text-lg mb-3">AI 生成用例</h3>
            <textarea id="requirement" rows="4" class="border p-2 w-full rounded mb-2"
                      placeholder="输入需求描述，例如：用户登录接口，支持用户名密码登录，错误密码返回401"></textarea>
            <div class="flex gap-2 mb-3">
                <input id="generateCount" type="number" value="5" min="1" max="20" class="border p-2 w-20 rounded" title="生成数量">
                <button onclick="generateCases()" class="bg-indigo-600 text-white px-4 py-2 rounded flex-1">AI 生成</button>
            </div>
            <div class="border-t pt-3">
                <h4 class="font-semibold mb-2">接口扫描</h4>
                <button onclick="scanApis()" class="bg-teal-600 text-white px-4 py-2 rounded w-full">扫描全部 API</button>
                <div id="apiList" class="mt-3 max-h-64 overflow-y-auto text-sm"></div>
            </div>
        </div>

        <!-- 套件与用例 -->
        <div class="bg-white rounded-lg p-5 shadow lg:col-span-2">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-lg">套件与用例</h3>
                <div class="flex gap-2">
                    <input id="newSuiteName" class="border p-2 rounded" placeholder="新建套件名">
                    <button onclick="createSuite()" class="bg-green-600 text-white px-3 py-2 rounded">新建套件</button>
                </div>
            </div>
            <select id="suiteSelect" onchange="loadCases()" class="border p-2 rounded w-full mb-3"></select>
            <div id="caseTable" class="text-sm"></div>
        </div>
    </div>

    <!-- 执行记录 -->
    <div class="bg-white rounded-lg p-5 shadow mb-6">
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-lg">执行记录</h3>
            <button onclick="createExecution()" class="bg-blue-600 text-white px-4 py-2 rounded">新建执行</button>
        </div>
        <div id="executionTable" class="text-sm"></div>
    </div>

    <!-- 执行详情 -->
    <div id="executionDetail" class="bg-white rounded-lg p-5 shadow mb-6 hidden">
        <h3 class="font-bold text-lg mb-3">执行详情 <button onclick="closeDetail()" class="text-gray-400 ml-3 text-sm">关闭</button></h3>
        <div id="detailContent"></div>
    </div>
</div>

<script src="/static/js/qa.js"></script>
</body>
</html>
