<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 旅行助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-10">
        <h1 class="text-3xl font-bold">AI 旅行助手</h1>

        <div class="bg-white p-5 mt-5">
            <h2 class="font-bold mb-3">RAG 知识问答</h2>
            <input id="question" class="border p-2 w-full" placeholder="例如：东京有哪些必去景点？">
            <button onclick="askAI()" class="bg-blue-500 text-white px-5 py-2 mt-3">提问</button>
            <div id="answer" class="mt-4 p-4 bg-gray-50"></div>
        </div>

        <div class="bg-white p-5 mt-5">
            <h2 class="font-bold mb-3">智能方案推荐</h2>
            <input id="destination" class="border p-2" placeholder="目的地">
            <input id="days" class="border p-2" placeholder="天数">
            <button onclick="recommend()" class="bg-green-500 text-white px-5 py-2">生成计划</button>
            <div id="plan" class="mt-4 p-4 bg-gray-50"></div>
        </div>
    </div>
    <script src="/static/js/ai.js"></script>
</body>
</html>
